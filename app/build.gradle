plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smoothcursor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.smoothcursor'
        minSdk 24
        targetSdk 33
        versionCode 5
        versionName "5.0"
    }

    signingConfigs {
        // Фиксированный ключ, чтобы обновления ставились поверх без конфликта подписи
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
